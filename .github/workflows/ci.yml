name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-latex-template:
    name: Build LaTeX report template
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile templates/latex-report/main.tex
        uses: dante-ev/latex-action@v2
        with:
          root_file: main.tex
          working_directory: templates/latex-report
          latexmk_use_xelatex: false
