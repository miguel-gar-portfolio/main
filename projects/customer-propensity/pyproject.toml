[project]
name = "customer-propensity"
version = "0.1.0"
description = "Customer-propensity classification and a proposal for detecting legal company names."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy==2.0.2",
    "pandas==2.2.2",
    "matplotlib==3.9.2",
    "scikit-learn==1.5.1",
    "xgboost==3.4.1",
    "shap==0.52.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
    "jupyterlab>=4.2",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["notebooks"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/customer_propensity"]
